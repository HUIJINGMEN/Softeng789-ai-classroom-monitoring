services:
  postgres:
    image: postgres:16
    container_name: classroom-monitoring-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-classroom_monitoring}
      POSTGRES_USER: ${POSTGRES_USER:-classroom_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    ports:
      - "${POSTGRES_BIND_HOST:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-classroom_user} -d ${POSTGRES_DB:-classroom_monitoring}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
