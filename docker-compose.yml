services:
  postgres:
    image: postgres:16
    container_name: classroom-monitoring-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-classroom_monitoring}
      POSTGRES_USER: ${POSTGRES_USER:-classroom_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-classroom_user} -d ${POSTGRES_DB:-classroom_monitoring}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
