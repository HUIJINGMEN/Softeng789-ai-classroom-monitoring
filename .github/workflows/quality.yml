name: Quality checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/requirements.lock

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Install AI adapter dependencies
        working-directory: ai-service
        run: |
          python -m pip install --only-binary=:all: --upgrade pip==26.2.1 setuptools==84.1.0
          python -m pip install --only-binary=:all: --require-hashes -r requirements.lock

      - name: Run project quality gate
        run: ./scripts/quality-check.sh

      - name: Check dependency security and applicability
        env:
          AI_PYTHON: python3
        run: sh scripts/check-security.sh

      - name: Validate fresh and upgraded PostgreSQL schemas
        run: python3 scripts/test-postgres-schema.py
