name: Quality checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ai-service/requirements.txt
            ai-service/requirements-cv.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install AI adapter dependencies
        working-directory: ai-service
        run: pip install -r requirements-cv.txt

      - name: Install checksum-verified vision models for smoke tests
        working-directory: ai-service
        run: python scripts/install_cv_models.py

      - name: Run project quality gate
        run: ./scripts/quality-check.sh
