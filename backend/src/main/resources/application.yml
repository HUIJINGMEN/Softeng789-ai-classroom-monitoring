server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: classroom-monitoring-backend
  servlet:
    multipart:
      max-file-size: 8MB
      # Seven enrolment captures are resized and JPEG-compressed client-side.
      # Keep the whole multipart request bounded as well as each individual file.
      max-request-size: 8MB
  mvc:
    problemdetails:
      enabled: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration

management:
  endpoints:
    web:
      exposure:
        include: health,info
